name: Publish release images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mill-release-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        name: Validate stable tag and current source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = "false"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          test "$(jq -r .version package.json)" = "$version"
          test "$(jq -r .version apps/web/package.json)" = "$version"
          test "$(jq -r .version apps/web-server/package.json)" = "$version"
          commit="$(git rev-parse 'HEAD^{commit}')"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$commit"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            test "$(cat "$RUNNER_TEMP/release-state")" = "true"
          fi
          {
            echo "commit=$commit"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Require the latest exact-commit CI result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            gh api "repos/$GH_REPO/commits/$RELEASE_COMMIT/check-runs?filter=all&per_page=100" --paginate --slurp > "$RUNNER_TEMP/release-checks.json"
            if node tools/release-check.mjs --commit "$RELEASE_COMMIT" --checks "$RUNNER_TEMP/release-checks.json"; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 15
          done

  build:
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            architecture: amd64
            runner: ubuntu-24.04
          - component: api
            architecture: arm64
            runner: ubuntu-24.04-arm
          - component: web
            architecture: amd64
            runner: ubuntu-24.04
          - component: web
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=ghcr.io/avgeek-oss/mill-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-mill-${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-mill-${{ matrix.component }}-${{ matrix.architecture }}
          secrets: npm_token=${{ github.token }}
          build-args: |
            SOURCE_COMMIT=${{ needs.prepare.outputs.commit }}
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Record immutable platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component }}-${{ matrix.architecture }}
          path: digests/*
          if-no-files-found: error
          retention-days: 14

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: digests
      - name: Assemble native platform manifests
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          for component in api web; do
            repository="ghcr.io/avgeek-oss/mill-$component"
            sources=()
            for architecture in amd64 arm64; do
              files=(digests/digest-"$component"-"$architecture"/*)
              test "${#files[@]}" -eq 1
              digest="$(basename "${files[0]}")"
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              sources+=("$repository@sha256:$digest")
            done
            docker buildx imagetools create \
              --tag "$repository:$RELEASE_TAG" \
              --tag "$repository:$RELEASE_VERSION" \
              --tag "$repository:$RELEASE_COMMIT" \
              "${sources[@]}"
          done
      - name: Inspect both registry images and write release manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node tools/release-images.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" mill-images.json
      - name: Require anonymous access to both immutable release images
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          for component in api web; do
            image="$(jq -r ".images.$component" mill-images.json)"
            if ! DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$image" >/dev/null; then
              echo "::error::Make the Mill $component GHCR package public, then rerun this release workflow."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: mill-images.json
          if-no-files-found: error
          retention-days: 14

  local-installation-smoke:
    needs: [prepare, manifest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-images
      - name: Verify both pulled images through the production installation gate
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          MILL_VERIFY_EXPECT_ARCH: ${{ matrix.architecture }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {readReleaseImages} from "./tools/release-images.mjs"; await readReleaseImages("mill-images.json", process.env.RELEASE_TAG, process.env.RELEASE_COMMIT)'
          MILL_VERIFY_API_IMAGE="$(jq -r .images.api mill-images.json)" \
          MILL_VERIFY_WEB_IMAGE="$(jq -r .images.web mill-images.json)" \
          node tools/production-verify.mjs
      - name: Preserve installation and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-installation-${{ matrix.architecture }}
          path: tmp/verification/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, manifest, local-installation-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-images
      - name: Publish validated release with immutable image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Mill $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" mill-images.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
