name: Publish release images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mill-release-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    # The CI poll waits up to 3 minutes; the checks before it take seconds.
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Validate stable tag and current source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = "false"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          test "$(jq -r .version package.json)" = "$version"
          test "$(jq -r .version apps/web/package.json)" = "$version"
          test "$(jq -r .version apps/web-server/package.json)" = "$version"
          for component in api web; do
            image="$(sed -n "s/^    image: ghcr.io\/avgeek-oss\/mill-$component://p" docker-compose.yml)"
            test "$image" = "$version"
          done
          commit="$(git rev-parse 'HEAD^{commit}')"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$commit"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            test "$(cat "$RUNNER_TEMP/release-state")" = "true"
          fi
          # Publishing marks the release as Latest, so refuse a version older
          # than the latest published release.
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          if [ "$(node tools/release-latest.mjs "$RELEASE_TAG" "$RUNNER_TEMP/releases.json")" != "true" ]; then
            echo "::error::A newer release than $RELEASE_TAG is already published."
            exit 1
          fi
          {
            echo "commit=$commit"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Require the latest exact-commit CI result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            gh api "repos/$GH_REPO/commits/$RELEASE_COMMIT/check-runs?filter=all&per_page=100" --paginate --slurp > "$RUNNER_TEMP/release-checks.json"
            if node tools/release-check.mjs --commit "$RELEASE_COMMIT" --checks "$RUNNER_TEMP/release-checks.json"; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 15
          done

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Removing the builder in the post step took 20-63 s per job; the runner is discarded anyway.
          cleanup: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Both images share the Dockerfile build stage. One bake invocation
      # builds that stage once and the api and web targets concurrently on the
      # same builder, with the same arguments, labels and attestations the
      # per-image build-push-action steps used.
      - name: Build and push both platform images by digest
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CREATED: ${{ needs.prepare.outputs.created }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILDER_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          definition="$RUNNER_TEMP/release.bake.json"
          jq -n '
            def image($component): {
              context: ".",
              dockerfile: "Dockerfile",
              target: $component,
              platforms: ["linux/\(env.ARCHITECTURE)"],
              args: {SOURCE_COMMIT: env.SOURCE_COMMIT, RELEASE_VERSION: env.RELEASE_VERSION},
              labels: {
                "org.opencontainers.image.created": env.CREATED,
                "org.opencontainers.image.revision": env.SOURCE_COMMIT,
                "org.opencontainers.image.source": env.SOURCE_URL,
                "org.opencontainers.image.version": env.RELEASE_VERSION
              },
              attest: ["type=provenance,mode=max,builder-id=\(env.BUILDER_ID)", "type=sbom"],
              output: ["type=image,name=ghcr.io/avgeek-oss/mill-\($component),push-by-digest=true,name-canonical=true,push=true"]
            };
            {group: {default: {targets: ["api", "web"]}}, target: {api: image("api"), web: image("web")}}
          ' > "$definition"
          docker buildx bake --file "$definition" --metadata-file "$RUNNER_TEMP/release.metadata.json" --progress plain
          for component in api web; do
            digest="$(jq -r --arg component "$component" '.[$component]["containerimage.digest"]' "$RUNNER_TEMP/release.metadata.json")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            mkdir -p "digests/$component"
            touch "digests/$component/${digest#sha256:}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-api-${{ matrix.architecture }}
          path: digests/api/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-web-${{ matrix.architecture }}
          path: digests/web/*
          if-no-files-found: error
          retention-days: 14

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    # Recent runs took under 2 minutes; registry calls get some headroom.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
      - name: Assemble native platform manifests
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          for component in api web; do
            repository="ghcr.io/avgeek-oss/mill-$component"
            sources=()
            for architecture in amd64 arm64; do
              files=(digests/digest-"$component"-"$architecture"/*)
              test "${#files[@]}" -eq 1
              digest="$(basename "${files[0]}")"
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              sources+=("$repository@sha256:$digest")
            done
            docker buildx imagetools create \
              --tag "$repository:$RELEASE_TAG" \
              --tag "$repository:$RELEASE_VERSION" \
              --tag "$repository:$RELEASE_COMMIT" \
              "${sources[@]}"
          done
      - name: Inspect both registry images and write release manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node tools/release-images.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" mill-images.json
      - name: Require anonymous access to both immutable release images
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          for component in api web; do
            image="$(jq -r ".images.$component" mill-images.json)"
            if ! DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$image" >/dev/null; then
              echo "::error::Make the Mill $component GHCR package public, then rerun this release workflow."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: mill-images.json
          if-no-files-found: error
          retention-days: 14

  local-installation-smoke:
    needs: [prepare, manifest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # amd64 is not repeated here: prepare requires the latest verify
        # result for this exact commit to be a success, and that includes the
        # production job, which runs this same installation gate natively on
        # amd64. The manifest job still pulls the amd64 registry images and
        # checks their platform, revision, version and source labels.
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
      - name: Date the scanner database cache
        id: scanner-cache
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # The vulnerability database is reused for the day (and refreshed by the
      # scanner when stale) instead of being downloaded into a per-run volume.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ steps.scanner-cache.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify both pulled images through the production installation gate
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          MILL_VERIFY_EXPECT_ARCH: ${{ matrix.architecture }}
          MILL_VERIFY_SCANNER_CACHE: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          mkdir -p "$MILL_VERIFY_SCANNER_CACHE"
          node --input-type=module -e 'import {readReleaseImages} from "./tools/release-images.mjs"; await readReleaseImages("mill-images.json", process.env.RELEASE_TAG, process.env.RELEASE_COMMIT)'
          MILL_VERIFY_API_IMAGE="$(jq -r .images.api mill-images.json)" \
          MILL_VERIFY_WEB_IMAGE="$(jq -r .images.web mill-images.json)" \
          node tools/production-verify.mjs
      - name: Let the cache step read the scanner database
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/trivy-cache" || true
      - name: Preserve installation and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-installation-${{ matrix.architecture }}
          path: tmp/verification/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, manifest, local-installation-smoke]
    runs-on: ubuntu-24.04
    # Recent runs took about 10 seconds.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
      - name: Publish validated release with immutable image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Mill $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" mill-images.json --clobber
          # prepare refused an older version, but check again here: a newer
          # release published since then keeps Latest.
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          latest=$(node tools/release-latest.mjs "$RELEASE_TAG" "$RUNNER_TEMP/releases.json")
          if [ "$latest" != "true" ]; then
            echo "::warning::A newer release than $RELEASE_TAG was published meanwhile, so $RELEASE_TAG is not marked Latest."
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
