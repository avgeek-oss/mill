name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: mill_test
          POSTGRES_USER: mill
          POSTGRES_PASSWORD: disposable-ci-database-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mill -d mill_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://mill:disposable-ci-database-password@127.0.0.1:5432/mill_test
      MILL_BASE_URL: http://127.0.0.1:4321
      MILL_SECRET: disposable-ci-secret-for-verification-only-0000000000000000
      NODE_ENV: test
      ALLOW_INSECURE_LOCALHOST: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@avgeek-oss"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm verify
        env:
          NODE_ENV: production
      - run: node tools/docs-check.mjs
      - run: node --test tools/*.test.mjs
      - run: bash -n tools/backup.sh tools/restore.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: mill_browser
          POSTGRES_USER: mill
          POSTGRES_PASSWORD: disposable-browser-database-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mill -d mill_browser" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://mill:disposable-browser-database-password@127.0.0.1:5432/mill_browser
      MILL_BASE_URL: http://127.0.0.1:4321
      MILL_SECRET: disposable-browser-secret-for-verification-000000000000000
      NODE_ENV: test
      ALLOW_INSECURE_LOCALHOST: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@avgeek-oss"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NODE_ENV: production
      - run: pnpm test:browser
      - name: Preserve browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
      - name: Build and exercise a disposable production installation
        env:
          MILL_VERIFY_EXPECT_ARCH: amd64
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node tools/production-verify.mjs
      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-verification
          path: tmp/verification/
          retention-days: 14

  required-ci:
    name: Required CI
    if: always()
    needs: [verify, browser, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) { if (job.result !== "success") { console.error(name + ": " + job.result); process.exitCode = 1; } }'

  private-release-artifacts:
    name: Prepare private native artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') && github.event.repository.private == true && needs.required-ci.result == 'success'
    needs: required-ci
    permissions:
      contents: read
      checks: read
      packages: read
    uses: ./.github/workflows/release-artifacts.yml
    with:
      source_revision: ${{ github.sha }}
