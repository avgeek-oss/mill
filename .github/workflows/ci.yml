name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read
  packages: read

concurrency:
  # Pull request runs are grouped by branch so a newer push supersedes the
  # running check. Every other run is grouped by commit, so main pushes and
  # tags are never cancelled or replaced while pending; the release checks
  # need a result for each exact commit.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The former verify job ran every check in one serial chain. The checks
  # that need no database run in static, the Node suite runs in test, and
  # verify keeps its name and meaning (all of them passed) because branch
  # protection requires that check.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: test
      - run: pnpm docs:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:operations
      - run: pnpm audit --prod --audit-level=moderate
      - run: bash -n tools/backup.sh tools/restore.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: mill_test
          POSTGRES_USER: mill
          POSTGRES_PASSWORD: disposable-ci-database-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mill -d mill_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://mill:disposable-ci-database-password@127.0.0.1:5432/mill_test
      MILL_BASE_URL: http://127.0.0.1:4321
      MILL_SECRET: disposable-ci-secret-for-verification-only-0000000000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          NODE_ENV: production

  verify:
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the static checks and the test suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) { if (job.result !== "success") { console.error(name + ": " + job.result); process.exitCode = 1; } }'

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
      - name: Date the scanner database cache
        id: scanner-cache
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # The vulnerability database is reused for the day (and refreshed by the
      # scanner when stale) instead of being downloaded into a per-run volume.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ steps.scanner-cache.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-${{ runner.arch }}-
      # A BuildKit builder with the Actions cache exposed lets the source
      # image build read (and on main, write) a layer cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Expose the Actions cache to BuildKit
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_CACHE_URL", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_SERVICE_V2"])
              if (process.env[name]) core.exportVariable(name, process.env[name]);
      - name: Build and exercise a disposable production installation
        env:
          MILL_VERIFY_EXPECT_ARCH: amd64
          MILL_VERIFY_SCANNER_CACHE: ${{ runner.temp }}/trivy-cache
          MILL_VERIFY_BUILD_CACHE_SCOPE: ci-production
          # Measurement commit: this PR also writes the cache.
          MILL_VERIFY_BUILD_CACHE_WRITE: "true"
        run: |
          mkdir -p "$MILL_VERIFY_SCANNER_CACHE"
          node tools/production-verify.mjs
      - name: Let the cache step read the scanner database
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/trivy-cache" || true
      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-verification
          path: tmp/verification/
          retention-days: 14

  required-ci:
    name: Required CI
    if: always()
    needs: [verify, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) { if (job.result !== "success") { console.error(name + ": " + job.result); process.exitCode = 1; } }'
