services:
  api:
    image: ghcr.io/avgeek-oss/mill-api:1.0.1
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4321
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MILL_BASE_URL: ${MILL_BASE_URL:?set MILL_BASE_URL}
      MILL_SECRET: ${MILL_SECRET:?set MILL_SECRET}
      MILL_SMTP_HOST: ${MILL_SMTP_HOST:-}
      MILL_SMTP_PORT: ${MILL_SMTP_PORT:-587}
      MILL_SMTP_SECURE: ${MILL_SMTP_SECURE:-false}
      MILL_SMTP_USER: ${MILL_SMTP_USER:-}
      MILL_SMTP_PASSWORD: ${MILL_SMTP_PASSWORD:-}
      MILL_SMTP_FROM: ${MILL_SMTP_FROM:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  web:
    image: ghcr.io/avgeek-oss/mill-web:1.0.1
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4322
      MILL_API_URL: http://api:4321
    ports:
      - "127.0.0.1:4321:4322"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
