# yaml-language-server: $schema=https://towbar.dev/schemas/app.v2.json
id: mill-api
name: Mill API
deployment:
  type: image
  image: ghcr.io/avgeek-oss/mill-api@sha256:774035bd81e8e65fc32c2026eacba4300d39776b01ca182a7dd5e7ae89e2a66a
autoDeploy: false
rollout:
  type: recreate
  maintenanceMode: true
  reason: Keep one API container during the upgrade.
container:
  network: mill
  port: 4321
  resources:
    cpus: 0.25
    memory: 512m
health:
  type: http
  path: /health/ready
  timeoutSeconds: 180
secrets:
  runtime:
    - DATABASE_URL
    - MILL_WEB_URL
    - MILL_API_URL
    - MILL_SECRET
    - MILL_S3_ENDPOINT
    - MILL_S3_REGION
    - MILL_S3_BUCKET
    - MILL_S3_ACCESS_KEY_ID
    - MILL_S3_SECRET_ACCESS_KEY
domains:
  primary: mill-api.avgeek.ltd
tls:
  mode: cloudflare-dns
environments:
  production:
    server: 13.206.149.158
