packages:
  - apps/*
  - packages/*
injectWorkspacePackages: true
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@avgeek-oss/mintlify-docs@0.1.6"
  - "@avgeek-oss/design-system@1.3.2"
# Optional peers that no workspace package pins; keep them on patched releases.
overrides:
  "next@>=16.0.0 <16.4.1": 16.4.3
  # Node 24 types everywhere, including transitive "*" and peer ranges.
  "@types/node": 24.19.2
